version: 2
updates:
  - package-ecosystem: npm # pnpm
    directory: /
    target-branch: canary
    schedule:
      interval: weekly
    # Same rule as minimumReleaseAge in pnpm-workspace.yaml. Security updates are not delayed.
    cooldown:
      default-days: 14
    groups:
      # vite-plus pins vite (vite-plus-core) and vitest: they move together.
      vite-plus:
        patterns:
          - vite-plus
          - vite
          - vitest
          - "@voidzero-dev/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: canary
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
